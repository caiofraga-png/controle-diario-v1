name: Publicar homologação Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feature/leste-firebase-multusuario'
    runs-on: ubuntu-latest
    environment: homologacao
    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Compilar aplicação para Firebase Hosting
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyBoKGbTuUZobtC-H-PU6mFpmIpD8Z-gJG0"
          VITE_FIREBASE_AUTH_DOMAIN: "controle-diario-510808.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "controle-diario-510808"
          VITE_FIREBASE_APP_ID: "1:694384996130:web:af87189c4b04cdd3857f7b"
        run: npm run build

      - name: Publicar canal temporário de homologação
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROLE_DIARIO_510808 }}
          projectId: controle-diario-510808
          channelId: homologacao
          expires: 7d
