name: Deploy CONTROLE DIÁRIO Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicação Web
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
