name: Publicar CONTROLE DIÁRIO em produção

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicacao-producao
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Conferir configuração exclusiva de produção
        env:
          PROD_FIREBASE_API_KEY: ${{ vars.PROD_FIREBASE_API_KEY }}
          PROD_FIREBASE_AUTH_DOMAIN: ${{ vars.PROD_FIREBASE_AUTH_DOMAIN }}
          PROD_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
          PROD_FIREBASE_APP_ID: ${{ vars.PROD_FIREBASE_APP_ID }}
        run: |
          test -n "$PROD_FIREBASE_API_KEY" || { echo "Configuração PROD_FIREBASE_API_KEY ausente no ambiente producao."; exit 1; }
          test -n "$PROD_FIREBASE_AUTH_DOMAIN" || { echo "Configuração PROD_FIREBASE_AUTH_DOMAIN ausente no ambiente producao."; exit 1; }
          test -n "$PROD_FIREBASE_PROJECT_ID" || { echo "Configuração PROD_FIREBASE_PROJECT_ID ausente no ambiente producao."; exit 1; }
          test -n "$PROD_FIREBASE_APP_ID" || { echo "Configuração PROD_FIREBASE_APP_ID ausente no ambiente producao."; exit 1; }
          test "$PROD_FIREBASE_PROJECT_ID" != "controle-diario-510808" || { echo "Bloqueado: produção não pode usar o projeto de homologação."; exit 1; }

      - name: Compilar aplicação com Firebase exclusivo de produção
        env:
          DEPLOY_TARGET: "github-pages"
          VITE_FIREBASE_API_KEY: ${{ vars.PROD_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.PROD_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.PROD_FIREBASE_APP_ID }}
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato de produção
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          name: producao-${{ github.run_attempt }}

      - name: Publicar site de produção
        uses: actions/deploy-pages@v4
        with:
          artifact_name: producao-${{ github.run_attempt }}
