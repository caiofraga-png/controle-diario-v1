name: Deploy CONTROLE DIÁRIO Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicação Web
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyBoKGbTuUZobtC-H-PU6mFpmIpD8Z-gJG0"
          VITE_FIREBASE_AUTH_DOMAIN: "controle-diario-510808.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "controle-diario-510808"
          VITE_FIREBASE_APP_ID: "1:694384996130:web:af87189c4b04cdd3857f7b"
        run: npm run build

      - name: Compilar aplicação Web
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          name: github-pages-${{ github.run_attempt }}

      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
