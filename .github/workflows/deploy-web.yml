name: Deploy CONTROLE DIÁRIO Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Configurar chave do Google Picker
        env:
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = {
            googleClientId: "694384996130-190cb97ksaebs11p975137j8m6m3fbpn.apps.googleusercontent.com",
            googlePickerApiKey: process.env.GOOGLE_PICKER_API_KEY || ""
          };
          fs.writeFileSync(
            "src/renderer/public/config.js",
            "window.__CONTROLE_DIARIO_CONFIG__ = " + JSON.stringify(config, null, 2) + ";\n"
          );
          NODE

      - name: Compilar aplicação Web
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
