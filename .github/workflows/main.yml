name: Build CONTROLE DIÁRIO V1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Gerar instalador
        run: npm run dist

      - name: Publicar instalador como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CONTROLE-DIARIO-V1
          path: release/*.exe
          if-no-files-found: error
