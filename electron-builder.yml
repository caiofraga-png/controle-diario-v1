appId: br.controlediario.app
productName: CONTROLE DIÁRIO
directories:
  output: release
files:
  - dist/**
  - package.json
win:
  target:
    - nsis
  artifactName: CONTROLE-DIARIO-${version}-Setup.${ext}

extraResources:
  - from: google-oauth-client.json
    to: google-oauth-client.json
  - from: google-picker-api-key.txt
    to: google-picker-api-key.txt
